# Valeo_SVMtrial 설정 (SETUP.md §14)
input:
  # 2026-10-14 확정 입력. legacy 로 바꾸면 SETUP.md §6 의 data/raw/pdfs/<doc_type>/<customer>/ 구조를 쓴다.
  layout: inputdata               # inputdata | legacy
  root: InputData                 # InputData/Documents/*.pdf + InputData/Judgement.xlsx
  documents: Documents
  judgement: Judgement.xlsx       # FileName | Person1 | Person2 | … , 값 p / f / f(사유)
  judgement_sheet: ""             # 비우면 첫 시트
  file_column: FileName
  doc_type: ""                    # 비우면 그룹명 InputData. 예: 대책서 → 8D 섹션 seed 사용(자율 모드 제외)
paths:
  raw_pdfs: data/raw/pdfs         # legacy 레이아웃 전용
  labels: data/raw/labels         # legacy 레이아웃 전용
  work: work
  outputs: outputs
labels:
  columns: {doc_id: doc_id, customer: customer, doc_type: doc_type, rater: rater, result: result}
  pass_values: [Pass, P, OK, O, "○", 합격, "1", Y]
  fail_values: [Fail, F, NG, X, "×", 불합격, "0", N]
ingest:
  # 모든 PDF 는 페이지마다 이미지로 바꾼 뒤 이미지로만 처리한다 (텍스트 레이어·PDF 메타는 참고값).
  dpi: 150
  max_long_edge_px: 2400          # 페이지 크기가 제각각이어도 이미지 긴 변을 이 안으로 맞춘다
  landscape_ratio: 1.25
  retry_dpi: 250                  # 판독성 < ocr.min_legibility 인 페이지 재렌더 dpi
gemini:
  model_fast: ${GEMINI_MODEL_FAST}
  model_pro: ${GEMINI_MODEL_PRO}
  max_workers: 4
  max_retries: 6
  media_resolution_ocr: HIGH
  cost_per_1m_tokens: {}          # 사내 단가 확인 후 입력(선택). 예: {input: 0.3, output: 2.5}
  est_tokens_per_page: 1800       # --dry-run 추정용 (입력+출력 대략치)
claude:
  # SVMTRIAL_BACKEND=claude 일 때 쓰인다. 모델 ID 에 날짜 접미사를 붙이지 않는다.
  model_fast: claude-sonnet-5-5    # 대량 호출 (OCR·채점)
  model_pro: claude-opus-5-5       # 추론 (가설 생성·템플릿 작성)
  effort_fast: low                 # low | medium | high | xhigh | max
  effort_pro: high
  max_tokens: 16000
  prompt_cache: true               # 고정 지시문을 system 에 캐시 (반복 호출 비용 절감)
  sdk_max_retries: 2
ocr:
  min_legibility: 0.5
analysis:
  # --- 자율 모드 / 모델 / 목적함수 ---
  autonomous: false          # true 면 seed 미사용 + 🔒 자동통과 + 도메인 중립 v2 프롬프트 (R7 off)
  method: svm                # svm | logistic | hierarchical
  objective: decision_value  # decision_value | all_pass_prob
  monotone: false            # 존재 특징 계수 >= 0 제약
  use_causes: true           # Judgement 의 f(사유) → 기준(개념) 후보. 누수 방지를 위해 발견셋 사유만 쓴다
  target: unanimous               # unanimous | majority | ratio | ds
  pool_customers: false
  split: {discovery: 0.6, seed: 42}
  discovery: {rounds: 5, k_per_class: 4, max_hypotheses: 15}
  concepts_per_scoring_call: 25
  min_rater_labels: 30
  cv: {n_splits: 5, n_repeats: 10}
  n_permutations: 500
  n_bootstrap: 200
  scoring_recheck_ratio: 0.1
  scoring_min_agreement: 0.85
  min_n_per_feature: 10           # n_minor < 10 x n_features 이면 "탐색적" 표기
  unanimous_guard: {low: 0.15, high: 0.85}
  verdict:
    confirmed: {q: 0.1, stability: 0.90}
    likely: {q: 0.25, stability: 0.80}
    reference_rd: 0.15
template:
  section_min_presence: 0.7
  font: 맑은 고딕
  pptx_size: 16x9
  output: both               # image | docx | both — LayoutSpec 을 공통 원천으로
  preview_dpi: 150
