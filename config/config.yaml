# Valeo_SVMtrial 설정 (SETUP.md §14)
paths:
  raw_pdfs: data/raw/pdfs
  labels: data/raw/labels
  work: work
  outputs: outputs
labels:
  columns: {doc_id: doc_id, customer: customer, doc_type: doc_type, rater: rater, result: result}
  pass_values: [Pass, P, OK, O, "○", 합격, "1", Y]
  fail_values: [Fail, F, NG, X, "×", 불합격, "0", N]
ingest:
  dpi: 150
  landscape_ratio: 1.25
  retry_dpi: 250                  # 판독성 < ocr.min_legibility 인 페이지 재렌더 dpi
gemini:
  model_fast: ${GEMINI_MODEL_FAST}
  model_pro: ${GEMINI_MODEL_PRO}
  max_workers: 4
  max_retries: 6
  media_resolution_ocr: HIGH
  cost_per_1m_tokens: {}          # 사내 단가 확인 후 입력(선택). 예: {input: 0.3, output: 2.5}
  est_tokens_per_page: 1800       # --dry-run 추정용 (입력+출력 대략치)
ocr:
  min_legibility: 0.5
analysis:
  target: unanimous               # unanimous | majority | ratio | ds
  pool_customers: false
  split: {discovery: 0.6, seed: 42}
  discovery: {rounds: 5, k_per_class: 4, max_hypotheses: 15}
  concepts_per_scoring_call: 25
  min_rater_labels: 30
  cv: {n_splits: 5, n_repeats: 10}
  n_permutations: 500
  n_bootstrap: 200
  scoring_recheck_ratio: 0.1
  scoring_min_agreement: 0.85
  min_n_per_feature: 10           # n_minor < 10 x n_features 이면 "탐색적" 표기
  unanimous_guard: {low: 0.15, high: 0.85}
  verdict:
    confirmed: {q: 0.1, stability: 0.90}
    likely: {q: 0.25, stability: 0.80}
    reference_rd: 0.15
template:
  section_min_presence: 0.7
  font: 맑은 고딕
  pptx_size: 16x9
