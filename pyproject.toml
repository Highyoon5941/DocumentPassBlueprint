[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svmtrial"
version = "0.1.0"
description = "문서 Pass 조건 역추적 → 표준 템플릿 생성 (SVM + Gemini 하이브리드)"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
# imodels 내부의 sklearn 호출에서 나오는 폐기 경고는 우리가 고칠 수 없다.
# 우리 코드에서 나오는 경고는 가리지 않는다.
# 메시지에 콜론을 쓸 수 없다(pytest 필드 구분자). 모듈 기준으로만 거른다.
filterwarnings = [
    "ignore::FutureWarning:sklearn.linear_model._logistic",
    "ignore::UserWarning:sklearn.linear_model._logistic",
    "ignore::UserWarning:sklearn.model_selection._split",
    "ignore::UserWarning:sklearn.metrics._classification",
]
